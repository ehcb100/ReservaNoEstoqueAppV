name: Gerar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar site e plugin de notificacoes
        run: |
          python3 scripts/preparar_www.py
          npx esbuild native-push.js --bundle --format=iife --platform=browser --outfile=www/native-push.bundle.js

      - name: Preparar Capacitor
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configurar Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || {
            echo 'Falta GOOGLE_SERVICES_JSON_BASE64'
            exit 1
          }

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > android/app/google-services.json

          python3 - <<'PYVALID'
          import json

          d = json.load(
              open('android/app/google-services.json')
          )

          assert any(
              c.get('client_info', {})
               .get('android_client_info', {})
               .get('package_name') ==
               'br.com.reservanoestoque.comandas'
              for c in d.get('client', [])
          )
          PYVALID

      - name: Habilitar Google Services no Gradle
        run: |
          python3 - <<'PYGRADLE'
          from pathlib import Path

          app = Path('android/app/build.gradle')
          s = app.read_text()

          plugin = "apply plugin: 'com.google.gms.google-services'"

          if plugin not in s:
              app.write_text(s + "\n" + plugin + "\n")

          root = Path('android/build.gradle')
          s = root.read_text()

          dep = "classpath 'com.google.gms:google-services:4.4.2'"

          if dep not in s:
              assert 'dependencies {' in s

              root.write_text(
                  s.replace(
                      'dependencies {',
                      'dependencies {\n        ' + dep,
                      1
                  )
              )
          PYGRADLE

      - name: Configurar nome e icone Rowlet
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/configurar_android.py

      - name: Instalar toque suave JRPG no Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/alerta_jrpg.wav android/app/src/main/res/raw/alerta_jrpg.wav

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Comandas-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
